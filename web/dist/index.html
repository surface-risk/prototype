<style>
/* Layout concept: an instrument panel on deep navy. Hairline structure, data set in mono,
   one expanded display face for headings, and the ribbon "surface" mark as the only ornament. */
:root {
  --bg: #0A111D;
  --bg-2: #0E1726;
  --panel: #121D2F;
  --line: #22314A;
  --line-2: #2F4262;
  --fg: #E4EAF3;
  --fg-2: #A9B6C9;
  --fg-3: #7586A0;
  --accent: #8FB6E2;
  --accent-strong: #C3DAF3;
  --accent-ink: #0A111D;
  --accent-soft: rgba(143, 182, 226, 0.14);
  --steel: #5B7398;
  --good: #5FB49C;
  --warn: #D7A85A;
  --crit: #DD7A6E;
  --band-0: #C0675D;
  --band-1: #C9944A;
  --band-2: #6F87AA;
  --band-3: #6FA9C9;
  --band-4: #A6D0EE;
  --shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 12px 32px rgba(0,0,0,0.28);
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.125rem;
  --step-2: 1.4rem;
  --step-3: 1.9rem;
  --step-4: clamp(2.1rem, 4.6vw, 3.3rem);
  --radius: 10px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #EEF2F7; --bg-2: #F6F8FB; --panel: #FFFFFF; --line: #D5DDE8; --line-2: #B8C5D7;
    --fg: #0D1726; --fg-2: #3B4A60; --fg-3: #66768E; --accent: #1F4F8B; --accent-strong: #143A69;
    --accent-ink: #FFFFFF; --accent-soft: rgba(31, 79, 139, 0.09); --steel: #5F7699;
    --good: #2D876C; --warn: #A2711B; --crit: #B24B3F;
    --band-0: #B4544A; --band-1: #B9822F; --band-2: #5C7699; --band-3: #3D86AE; --band-4: #1F5F94;
    --shadow: 0 1px 2px rgba(13, 23, 38, 0.06), 0 8px 24px rgba(13, 23, 38, 0.06);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #EEF2F7; --bg-2: #F6F8FB; --panel: #FFFFFF; --line: #D5DDE8; --line-2: #B8C5D7;
  --fg: #0D1726; --fg-2: #3B4A60; --fg-3: #66768E; --accent: #1F4F8B; --accent-strong: #143A69;
  --accent-ink: #FFFFFF; --accent-soft: rgba(31, 79, 139, 0.09); --steel: #5F7699;
  --good: #2D876C; --warn: #A2711B; --crit: #B24B3F;
  --band-0: #B4544A; --band-1: #B9822F; --band-2: #5C7699; --band-3: #3D86AE; --band-4: #1F5F94;
  --shadow: 0 1px 2px rgba(13, 23, 38, 0.06), 0 8px 24px rgba(13, 23, 38, 0.06);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: var(--step-0); line-height: 1.55;
  margin: 0;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
a { color: var(--accent); text-underline-offset: 3px; }
a:hover { color: var(--accent-strong); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--font-display); font-stretch: 112%; text-wrap: balance; margin: 0; line-height: 1.12; letter-spacing: -0.01em; }
h1 { font-size: var(--step-4); font-weight: 650; }
h2 { font-size: var(--step-3); font-weight: 620; }
h3 { font-size: var(--step-1); font-weight: 600; }
p { margin: 0; max-width: 66ch; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--font-mono); font-size: var(--step--1); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.small { font-size: var(--step--1); }

.wrap { max-width: 1140px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.section { padding-block: clamp(40px, 7vw, 84px); }
.section + .section { border-top: 1px solid var(--line); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-lg { display: flex; flex-direction: column; gap: 28px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 28px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 20px; }
.grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 16px; }
.grid-2 > *, .grid-3 > *, .grid-4 > * { min-width: 0; }

/* Header */
.site-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.site-header .wrap { display: flex; align-items: center; gap: 20px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); flex-shrink: 0; }
.brand svg { width: 30px; height: 30px; display: block; }
.brand-word { font-family: var(--font-display); font-stretch: 112%; font-weight: 640; font-size: 1.05rem; letter-spacing: 0.01em; }
.brand-word span { font-weight: 400; color: var(--fg-2); }
.nav { display: flex; gap: 4px; margin-left: auto; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.nav a { color: var(--fg-2); text-decoration: none; padding: 7px 10px; border-radius: 7px; font-size: 0.9rem; }
.nav a:hover { color: var(--fg); background: var(--accent-soft); }
.nav a[aria-current="page"] { color: var(--fg); background: var(--accent-soft); }
.nav .btn { margin-left: 6px; }
.btn.menu-btn { display: none; margin-left: auto; }
@media (max-width: 860px) {
  .btn.menu-btn { display: inline-flex; }
  .nav { display: none; position: absolute; left: 0; right: 0; top: 100%; flex-direction: column; align-items: stretch;
    background: var(--bg-2); border-bottom: 1px solid var(--line); padding: 10px var(--gutter-r) 14px var(--gutter-l); gap: 2px; }
  .nav.open { display: flex; }
  .nav .btn { margin: 6px 0 0; justify-content: center; }
}

/* Buttons and chips */
.btn {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  font: 600 0.9rem/1 var(--font-body); padding: 11px 16px; border-radius: 8px;
  border: 1px solid var(--line-2); background: transparent; color: var(--fg); text-decoration: none;
}
.btn:hover { border-color: var(--accent); color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--accent-ink); }
.btn.small { padding: 7px 11px; font-size: 0.82rem; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 0.75rem/1 var(--font-mono); letter-spacing: 0.03em;
  padding: 5px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--fg-2); white-space: nowrap; }
.chip.accent { border-color: var(--accent); color: var(--accent); }
.chip.good { border-color: var(--good); color: var(--good); }
.chip.warn { border-color: var(--warn); color: var(--warn); }
.chip.crit { border-color: var(--crit); color: var(--crit); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.seg { display: inline-flex; align-self: flex-start; width: fit-content; max-width: 100%; flex-wrap: wrap; border: 1px solid var(--line-2); border-radius: 8px; padding: 3px; gap: 3px; background: var(--bg-2); }
.seg button { font: 500 0.82rem/1 var(--font-body); color: var(--fg-2); background: transparent; border: 0; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 0 0 1px var(--line-2); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(16px, 2.6vw, 26px); box-shadow: var(--shadow); min-width: 0; }
.rule { height: 1px; background: var(--line); border: 0; margin: 0; }
.notice { border: 1px dashed var(--line-2); border-radius: 8px; padding: 10px 14px; color: var(--fg-2); font-size: var(--step--1); }
.notice strong { color: var(--fg); }

/* Hero */
.hero { padding-block: clamp(40px, 7vw, 88px) clamp(28px, 5vw, 56px); }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); align-items: center; }
@media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; } }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .lede { font-size: var(--step-1); color: var(--fg-2); max-width: 54ch; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.facts > div { padding: 14px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }
.facts .v { font: 600 1.35rem/1.1 var(--font-mono); color: var(--fg); }
.facts .k { font-size: var(--step--1); color: var(--fg-2); margin-top: 4px; }

/* Lists */
.ticks { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.ticks li { padding-left: 22px; position: relative; color: var(--fg-2); }
.ticks li::before { content: ""; position: absolute; left: 2px; top: 0.62em; width: 9px; height: 2px; background: var(--accent); }
.ticks li strong { color: var(--fg); font-weight: 600; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; display: grid; gap: 0; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 16px; padding: 20px 0; border-top: 1px solid var(--line); align-items: start; }
.steps li::before { content: counter(s, decimal-leading-zero); font: 500 0.95rem/1.4 var(--font-mono); color: var(--accent); }
.steps .who { font: 500 0.78rem/1.4 var(--font-mono); color: var(--fg-3); text-align: right; }
@media (max-width: 600px) { .steps li { grid-template-columns: 40px minmax(0, 1fr); } .steps .who { grid-column: 2; text-align: left; } }

.area-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px; }
.area-group h3 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--line-2); margin-bottom: 10px; }
.area-group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; color: var(--fg-2); font-size: 0.9rem; }

/* Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 0.875rem; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 0.72rem/1.3 var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-3); background: var(--bg-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Pricing */
.price-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 16px; }
.price { border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; background: var(--panel); display: flex; flex-direction: column; gap: 10px; }
.price .amt { font: 600 1.7rem/1 var(--font-mono); }
.price .amt small { font-size: 0.8rem; color: var(--fg-3); font-weight: 400; }

/* Forms */
form .field, .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
label, .label { font-size: 0.84rem; color: var(--fg-2); font-weight: 500; }
input[type="text"], input[type="email"], input[type="number"], select, textarea {
  font: 400 0.95rem/1.3 var(--font-body); color: var(--fg); background: var(--bg-2);
  border: 1px solid var(--line-2); border-radius: 8px; padding: 10px 12px; width: 100%; min-width: 0;
}
textarea { min-height: 90px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px; }
.checks-list { display: grid; gap: 8px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 0.9rem; color: var(--fg-2); }
.check input { margin-top: 3px; accent-color: var(--accent); }
input[type="range"] { width: 100%; accent-color: var(--accent); }

/* Footer */
.site-footer { border-top: 1px solid var(--line); padding-block: 32px 40px; color: var(--fg-3); font-size: var(--step--1); }
.site-footer .wrap { display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; align-items: flex-start; }
.site-footer p { max-width: 70ch; }

/* App shell */
.app-bar { border-bottom: 1px solid var(--line); background: var(--bg-2); }
.app-bar .wrap { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding-block: 12px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs a { font-size: 0.86rem; text-decoration: none; color: var(--fg-2); padding: 8px 12px; border-radius: 7px; border: 1px solid transparent; }
.tabs a[aria-current="page"] { color: var(--fg); border-color: var(--line-2); background: var(--panel); }
.tabs a:hover { color: var(--fg); }

/* Wizard */
.wizard { display: grid; grid-template-columns: 220px minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
@media (max-width: 1080px) { .wizard { grid-template-columns: 200px minmax(0, 1fr); } .wizard .aside { grid-column: 1 / -1; } }
@media (max-width: 720px) { .wizard { grid-template-columns: 1fr; } }
.step-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.step-list button { width: 100%; text-align: left; background: transparent; border: 0; color: var(--fg-2); font: 500 0.88rem/1.3 var(--font-body); padding: 10px 12px; border-radius: 8px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
.step-list button .i { font: 500 0.75rem/1 var(--font-mono); width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; border: 1px solid var(--line-2); color: var(--fg-3); flex-shrink: 0; }
.step-list button[aria-current="step"] { background: var(--panel); color: var(--fg); box-shadow: 0 0 0 1px var(--line-2); }
.step-list button[aria-current="step"] .i { border-color: var(--accent); color: var(--accent); }
.step-list button.done .i { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
@media (max-width: 720px) { .step-list { grid-auto-flow: column; overflow-x: auto; } .step-list button { white-space: nowrap; } }

.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; font-size: 0.88rem; }
.kv dt { color: var(--fg-2); }
.kv dd { margin: 0; font-family: var(--font-mono); text-align: right; }

.bar-track { height: 8px; background: var(--bg-2); border-radius: 4px; position: relative; overflow: hidden; border: 1px solid var(--line); }
.bar-fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; }

/* Survey */
.survey { max-width: 760px; margin: 0 auto; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); transition: width 0.25s ease; }
.q { padding: 18px 0; border-top: 1px solid var(--line); display: grid; gap: 12px; }
.q .qtext { font-size: 1rem; color: var(--fg); }
.q .qid { font: 500 0.72rem/1 var(--font-mono); color: var(--fg-3); }
.anchors { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) auto; gap: 6px; }
@media (max-width: 640px) { .anchors { grid-template-columns: 1fr; } }
.anchors button, .opts button {
  font: 500 0.8rem/1.25 var(--font-body); color: var(--fg-2); background: var(--bg-2); border: 1px solid var(--line-2);
  border-radius: 8px; padding: 9px 8px; cursor: pointer; text-align: center; min-height: 44px;
}
.anchors button:hover, .opts button:hover { border-color: var(--accent); color: var(--fg); }
.anchors button[aria-pressed="true"], .opts button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.anchors button.dk { color: var(--fg-3); }
.opts { display: grid; gap: 6px; }
.opts.inline { grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.opts button { text-align: left; padding: 10px 12px; }

/* Report */
.report-head { display: grid; gap: 14px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
.kpi { padding: 16px 18px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; display: grid; gap: 6px; align-content: start; }
.kpi .k { font: 500 0.72rem/1.3 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-3); }
.kpi .v { font: 600 1.7rem/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 0.8rem; color: var(--fg-3); font-weight: 400; }
.kpi .s { font-size: 0.8rem; color: var(--fg-2); }
.messages { counter-reset: m; list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.messages li { counter-increment: m; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; color: var(--fg-2); }
.messages li::before { content: counter(m); font: 600 0.8rem/1.6 var(--font-mono); color: var(--accent); }
.messages strong { color: var(--fg); font-weight: 600; }

.areas-table { display: grid; gap: 0; }

":"Activity survey: key-person indicator","area":"E-RL","run":true,"result":0.508,"score":0.0,"weight":0.2},{"id":"A02","name":"Activity survey: unclear-responsibility indicator","area":"E-RR","run":true,"result":0.441,"score":25.0,"weight":0.2}],"engine_tests":[{"name":"Null firm (seed 1)","loss":50.8,"perf":51.2,"loss_tilt":-0.3,"archetype":"Steady","dept_flags":0,"mgmt_flags":3,"robustness":"Sensitive","verdict":"PASS: no structure invented"},{"name":"Null firm (seed 2)","loss":49.0,"perf":49.6,"loss_tilt":-0.6,"archetype":"Steady","dept_flags":0,"mgmt_flags":1,"robustness":"Sensitive","verdict":"PASS: no structure invented"},{"name":"Null firm (seed 3)","loss":49.5,"perf":50.0,"loss_tilt":-0.6,"archetype":"Steady","dept_flags":0,"mgmt_flags":1,"robustness":"Sensitive","verdict":"PASS: no structure invented"},{"name":"High-wire firm","loss":49.0,"perf":62.4,"loss_tilt":-13.4,"archetype":"Accelerating","dept_flags":0,"mgmt_flags":2,"robustness":"Sensitive","verdict":"PARTIAL: performance axis separates; loss axis stays Mid"},{"name":"Fortress firm","loss":53.7,"perf":41.1,"loss_tilt":12.5,"archetype":"Steady","dept_flags":0,"mgmt_flags":3,"robustness":"Robust","verdict":"PARTIAL: performance axis separates; loss axis stays Mid"}]},"ui":{"methodology_version":"0.5","areas":[{"code":"E-AC","name":"Accidental errors (people)","group":"Employees","loss_tier":"M","perf_tier":"L","loss_overrides":{"BL02":"H","BL05":"H"},"perf_overrides":{},"rationale":"Frequent slips, mostly small; occasional very large (fat-finger).","good":"Safe workplace; near misses and slips are reported and learned from; checks are built into routine work so simple errors are caught.","loss":"Keying, payment or instruction errors (wrong amount, account, security or recipient) cause direct losses, client compensation and data breaches.","perf":"Rework, correction effort and client apologies consume time; double-checking everything slows throughput."},{"code":"E-TC","name":"Training & competency","group":"Employees","loss_tier":"M","perf_tier":"H","loss_overrides":{"BL08":"H","BL09":"H","INS-L":"H"},"perf_overrides":{},"rationale":"Errors and unsuitable advice; strong driver of quality and productivity.","good":"Staff have the skills their roles need; training is planned and prioritised; skills are mapped to role requirements.","loss":"Staff who do not understand products, rules or systems give unsuitable advice, mis-execute, or miss red flags.","perf":"Slower work, more escalations and supervision, lower client service quality and weaker innovation."},{"code":"E-RL","name":"Resourcing & key people","group":"Employees","loss_tier":"M","perf_tier":"H","loss_overrides":{},"perf_overrides":{},"rationale":"Skipped controls and key-person risk; burnout and attrition.","good":"Workloads are sustainable; critical tasks have trained cover; succession exists for key people.","loss":"Stretched teams skip or shorten checks, build backlogs (e.g., KYC reviews) and depend on single individuals.","perf":"Burnout, attrition and hiring costs; firefighting crowds out improvement and growth work."},{"code":"E-RR","name":"Roles & responsibilities","group":"Employees","loss_tier":"M","perf_tier":"M","loss_overrides":{},"perf_overrides":{},"rationale":"Gaps between teams; duplicated effort.","good":"Clear, documented roles; individual ownership of processes and controls; no gaps or overlaps between teams.","loss":"Work and controls fall between people or teams; conflicting roles remove independent checks.","perf":"Duplicated effort, slow decisions and friction between teams."},{"code":"E-MC","name":"Communication","group":"Employees","loss_tier":"L","perf_tier":"M","loss_overrides":{},"perf_overrides":{},"rationale":"Hand-off errors, usually moderate; efficiency drag.","good":"Timely, accurate information flows between teams and to leadership; a single source of truth; leadership hears the truth first-hand.","loss":"Information arrives late, incomplete or distorted; warnings are not escalated.","perf":"Rework, delays and decisions taken on stale or wrong information."},{"code":"E-CU","name":"Culture & speak-up","group":"Employees","loss_tier":"H","perf_tier":"H","loss_overrides":{},"perf_overrides":{},"rationale":"Behind the largest conduct failures; drives engagement and retention.","good":"Shared vision; staff feel valued and safe to speak up; accountability and fair reward; continuous improvement encouraged.","loss":"Incentives and norms that tolerate rule-bending or silence lead to systemic misconduct and late discovery of problems.","perf":"Disengagement, turnover, silence about problems and lost ideas; culture is a major driver of productivity."},{"code":"E-MA","name":"Internal misconduct","group":"Employees","loss_tier":"M","perf_tier":"L","loss_overrides":{"BL01":"H","BL02":"H"},"perf_overrides":{},"rationale":"Rare but potentially severe (fraud, rogue trading).","good":"High integrity; ethical breaches have consequences regardless of seniority; trust backed by effective compliance oversight.","loss":"Deliberate wrongdoing by staff: fraud, unauthorised trading, theft of client funds or data.","perf":"Erosion of trust; heavy controls and investigations divert resources."},{"code":"P-DE","name":"Process & product design","group":"Process failure","loss_tier":"H","perf_tier":"H","loss_overrides":{},"perf_overrides":{},"rationale":"Repeated errors and mass client harm; cost-to-serve.","good":"Processes are defined, documented, efficient and have preventive controls built in.","loss":"Processes or products designed without adequate controls or suitability lead to repeated errors or mass mis-selling.","perf":"Unnecessary steps, approvals and hand-offs raise cost-to-serve and slow client service."},{"code":"P-IM","name":"Process execution","group":"Process failure","loss_tier":"H","perf_tier":"H","loss_overrides":{},"perf_overrides":{},"rationale":"Most frequent processing losses; workarounds and rework.","good":"Processes are followed consistently; non-adherence is identified; errors are caught before reaching clients or regulators.","loss":"Processes not followed or controls not operating: missed checks, unreconciled breaks, KYC not done.","perf":"Workarounds, rework and inconsistent output; quality depends on who does the work."},{"code":"P-CH","name":"Change & projects","group":"Process failure","loss_tier":"M","perf_tier":"H","loss_overrides":{},"perf_overrides":{},"rationale":"Outages and errors from change; delivery capacity limits growth.","good":"Change is planned, resourced, tested and communicated; benefits are tracked and realised.","loss":"Poorly planned or tested change introduces errors, outages and data problems.","perf":"Benefits not realised, change fatigue, delayed strategy."},{"code":"P-GO","name":"Governance & oversight","group":"Process failure","loss_tier":"H","perf_tier":"H","loss_overrides":{},"perf_overrides":{},"rationale":"Root cause in most major failures; decision quality.","good":"Management understand how the business works; clear accountability and decision-making; policies understood; outsourced providers actively overseen.","loss":"Leadership lacks information, challenge or accountability, so risks accumulate unseen (incl. outsourced providers).","perf":"Slow or poor decisions; strategy not executed; resources misallocated."},{"code":"SY1","name":"Systems functionality & capacity","group":"Systems","loss_tier":"M","perf_tier":"H","loss_overrides":{"BL01":"L","BL02":"H"},"perf_overrides":{"BL01":"M"},"rationale":"Workarounds and confusing systems cause errors; major productivity driver.","good":"Systems support end-to-end processes without manual gaps; data and reports are trusted.","loss":"Systems that do not fit processes force manual workarounds, re-keying and confusing interfaces that cause errors.","perf":"Manual effort, slow processing, poor data for decisions and limits on scale."},{"code":"SY2","name":"Availability & maintenance","group":"Systems","loss_tier":"M","perf_tier":"M","loss_overrides":{"BL05":"H","BL06":"H"},"perf_overrides":{"BL05":"H"},"rationale":"Outages and unsupported software / key-person spreadsheets.","good":"Software and devices are current and supported; critical spreadsheets/tools are controlled.","loss":"Unpatched or unsupported software is exploited or fails; uncontrolled spreadsheets produce errors.","perf":"Fragile, slow tools; dependence on individuals; costly emergency fixes."},{"code":"SY3","name":"Systems change delivery","group":"Systems","loss_tier":"M","perf_tier":"L","loss_overrides":{},"perf_overrides":{},"rationale":"Escaped defects and faulty releases; occasionally severe.","good":"The business specifies and tests changes; systems work as expected at go-live.","loss":"Changes or models not properly tested produce wrong results in live use.","perf":"Defects cost more to fix later; users lose confidence in systems."},{"code":"SY4","name":"Cyber security & access","group":"Systems","loss_tier":"H","perf_tier":"L","loss_overrides":{},"perf_overrides":{},"rationale":"Cyber and email-enabled fraud are among the most frequent losses for small firms.","good":"Access and configuration are controlled; least-privilege access; prompt removal on moves and leavers.","loss":"Wrong settings or excessive access expose data or allow wrong processing (e.g., wrong fee tables).","perf":"Access requests and fixes consume IT and user time."},{"code":"SY5","name":"Data & records","group":"Systems","loss_tier":"L","perf_tier":"M","loss_overrides":{"INS-L":"M"},"perf_overrides":{},"rationale":"Record-keeping failures; time lost finding information.","good":"Staff know what to keep, where and for how long; records are findable; destruction is controlled.","loss":"Records lost, kept too long, disposed of insecurely or not producible for regulators.","perf":"Time wasted searching for information; duplicated documents and versions."},{"code":"SY6","name":"Technology planning","group":"Systems","loss_tier":"L","perf_tier":"H","loss_overrides":{},"perf_overrides":{},"rationale":"Slow-burn cause of legacy and change problems; limits growth.","good":"IT plans follow business strategy; sufficient investment and expertise; lock-in managed.","loss":"Under-investment, lock-in and poor IT strategy leave the firm with fragile, outdated technology.","perf":"Technology fails to support growth; high running costs; competitors move faster."},{"code":"EX1","name":"External fraud","group":"External","loss_tier":"H","perf_tier":"L","loss_overrides":{},"perf_overrides":{},"rationale":"Impersonation, payment and counterparty fraud are frequent and costly.","good":"Instructions and requests are independently verified; counterparties are subject to due diligence; robust anti-fraud checks.","loss":"Clients, suppliers or counterparties commit fraud (fake instructions, forged documents, impersonation).","perf":"Extra verification friction; limited performance impact."},{"code":"EX2","name":"Physical & environmental events","group":"External","loss_tier":"L","perf_tier":"L","loss_overrides":{},"perf_overrides":{},"rationale":"Rare for most office-based firms; exposure depends on locations.","good":"Business continuity plans are clear, known and tested; critical work can continue remotely.","loss":"Pandemics, floods or earthquakes disrupt premises, people and providers.","perf":"Lost productivity during disruption; costs of relocation."},{"code":"EX3","name":"Geopolitical & regulatory change","group":"External","loss_tier":"M","perf_tier":"L","loss_overrides":{"BL04":"H","BL09":"H"},"perf_overrides":{},"rationale":"Sanctions and regulatory change bring fines, remediation and exits.","good":"The firm considers how geopolitical or economic shocks affect clients and operations.","loss":"Sanctions, conflict or instability in client, counterparty or provider jurisdictions freeze assets or force rapid exits.","perf":"Business lost in affected markets; management time absorbed."}],"statements":[{"id":"Q01","cause_code":"E-AC","area":"E-AC","text":"My workplace is physically safe, and accidents or near misses are reported and learned from.","format":"How true (5 anchors)","reverse":false},{"id":"Q02","cause_code":"E-AC","area":"E-AC","text":"Simple slips (e.g., wrong figure, wrong recipient) are rare because checks are built into how we work.","format":"How true (5 anchors)","reverse":false},{"id":"Q49","cause_code":"E-AC","area":"E-AC","text":"In the last 3 months, how often did a mistake by you or your team reach a client, counterparty or other external party?","format":"How often (5 anchors)","reverse":true},{"id":"Q03","cause_code":"E-TC","area":"E-TC","text":"I have the knowledge and skills I need to do my job well, including the rules that apply to it.","format":"How true (5 anchors)","reverse":false},{"id":"Q04","cause_code":"E-TC","area":"E-TC","text":"In the last 12 months I received training or development that genuinely improved how I do my job.","format":"How true (5 anchors)","reverse":false},{"id":"Q50","cause_code":"E-TC","area":"E-TC","text":"How often are you asked to do tasks you do not feel competent to do, without support?","format":"How often (5 anchors)","reverse":true},{"id":"Q05","cause_code":"E-RL","area":"E-RL","text":"I can complete my work to the required standard within my normal working hours.","format":"How true (5 anchors)","reverse":false},{"id":"Q06","cause_code":"E-RL","area":"E-RL","text":"If I were unexpectedly absent for two weeks, someone else could do my critical tasks without serious problems.","format":"How true (5 anchors)","reverse":false},{"id":"Q51","cause_code":"E-RL","area":"E-RL","text":"In the last month, how often were checks or controls skipped or shortened because there was not enough time?","format":"How often (5 anchors)","reverse":true},{"id":"Q07","cause_code":"E-RR","area":"E-RR","text":"I am clear what I am personally responsible for, including any checks or controls I own.","format":"How true (5 anchors)","reverse":false},{"id":"Q08","cause_code":"E-RR","area":"E-RR","text":"It is clear which team is responsible for each activity, so work does not fall between teams or get duplicated.","format":"How true (5 anchors)","reverse":false},{"id":"Q52","cause_code":"E-RR","area":"E-RR","text":"How often does work stall or get missed because nobody is sure who should do it?","format":"How often (5 anchors)","reverse":true},{"id":"Q09","cause_code":"E-MC","area":"E-MC","text":"Information I need from other teams reaches me on time, complete and accurate.","format":"How true (5 anchors)","reverse":false},{"id":"Q10","cause_code":"E-MC","area":"E-MC","text":"Senior management have an accurate picture of what really happens day to day in my area.","format":"How true (5 anchors)","reverse":false},{"id":"Q53","cause_code":"E-MC","area":"E-MC","text":"In the last 3 months, how often did you act on information that later turned out to be out of date or wrong?","format":"How often (5 anchors)","reverse":true},{"id":"Q11","cause_code":"E-CU","area":"E-CU","text":"I could raise a concern about a mistake or wrongdoing without fear of negative consequences.","format":"How true (5 anchors)","reverse":false},{"id":"Q12","cause_code":"E-CU","area":"E-CU","text":"People here are motivated, feel valued and would recommend the firm as a place to work.","format":"How true (5 anchors)","reverse":false},{"id":"Q54","cause_code":"E-CU","area":"E-CU","text":"In the last 6 months, I stayed silent about a problem because raising it seemed pointless or risky.","format":"Yes / No","reverse":true},{"id":"Q13","cause_code":"E-MA","area":"E-MA","text":"In the last 6 months I have felt pressure to bend rules or procedures to get things done.","format":"How often (5 anchors)","reverse":true},{"id":"Q14","cause_code":"E-MA","area":"E-MA","text":"Unethical behaviour has real consequences here, regardless of seniority or performance.","format":"How true (5 anchors)","reverse":false},{"id":"Q55","cause_code":"E-MA","area":"E-MA","text":"If I reported misconduct by a senior or high-performing colleague, I am confident it would be investigated fairly.","format":"How true (5 anchors)","reverse":false},{"id":"Q15","cause_code":"P-DE","area":"P-DE","text":"The processes I follow are documented, up to date and easy to find.","format":"How true (5 anchors)","reverse":false},{"id":"Q16","cause_code":"P-DE","area":"P-DE","text":"Our processes are efficient, without unnecessary steps, approvals or duplication.","format":"How true (5 anchors)","reverse":false},{"id":"Q17","cause_code":"P-DE","area":"P-DE","text":"Key processes have controls built in that prevent errors, rather than relying on catching them afterwards.","format":"How true (5 anchors)","reverse":false},{"id":"Q56","cause_code":"P-DE","area":"P-DE","text":"When a process involves several teams, the hand-off points (who passes what, when, and how it is checked) are clearly defined.","format":"How true (5 anchors)","reverse":false},{"id":"Q18","cause_code":"P-IM","area":"P-IM","text":"I often have to use manual workarounds (spreadsheets, emails, re-keying) because the standard process or system does not work.","format":"How often (5 anchors)","reverse":true},{"id":"Q19","cause_code":"P-IM","area":"P-IM","text":"Processes are followed consistently, whoever is doing the work.","format":"How true (5 anchors)","reverse":false},{"id":"Q20","cause_code":"P-IM","area":"P-IM","text":"Errors in my area are caught before they reach clients, counterparties or regulators.","format":"How true (5 anchors)","reverse":false},{"id":"Q57","cause_code":"P-IM","area":"P-IM","text":"In the last 3 months, how often did you see a required check signed off without being properly done?","format":"How often (5 anchors)","reverse":true},{"id":"Q21","cause_code":"P-CH","area":"P-CH","text":"Changes to processes or systems that affect me are planned, tested and explained before they go live.","format":"How true (5 anchors)","reverse":false},{"id":"Q22", <script>

const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f1 = (n) => (n == null || Number.isNaN(n) ? "–" : (Math.round(n * 10) / 10).toFixed(1));
const f0 = (n) => (n == null || Number.isNaN(n) ? "–" : String(Math.round(n)));
const sign = (n) => (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(Math.round(n * 10) / 10).toFixed(1);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const BANDS = U.bands; // [{label, from}]
function bandOf(score) {
  let idx = 0;
  BANDS.forEach((b, i) => { if (score >= b.from) idx = i; });
  return { idx, label: BANDS[idx].label };
}
const P = U.parameters;
function zone(v) { return v < P.archetype_low ? "Low" : v < P.archetype_high ? "Mid" : "High"; }
function archetypeOf(loss, perf) {
  const key = zone(loss) + "|" + zone(perf);
  return U.archetypes.find((a) => a.key === key) || { name: "–", description: "" };
}

function go() {

  $$("[data-nav]").forEach((a) => {

/* ---------- Shared charts ---------- */

// Staff vs management view per area (dumbbell), sorted by gap.
function gapChart({ rows = R.areas, compact = false } = {}) {
  const data = [...rows].sort((a, b) => b.gap - a.gap);
  const fs = compact ? 12 : 11.5, rowH = compact ? 21 : 22, top = 30, W = compact ? 480 : 660;
  const left = compact ? 196 : 238, right = 96;
  const maxCh = compact ? 26 : 34;
  const H = top + data.length * rowH + 30;
  const x = (v) => left + (v / 100) * (W - left - right);
  const nm = (s) => (s.length > maxCh ? s.slice(0, maxCh - 1) + "…" : s);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Staff and management scores by area for the fictional sample firm" style="font-size:${fs}px">`;
  [0, 20, 40, 60, 80, 100].forEach((t) => {
    s += `<line class="grid" x1="${x(t)}" x2="${x(t)}" y1="${top - 8}" y2="${H - 24}"/><text x="${x(t)}" y="${H - 8}" text-anchor="middle" style="font-size:${fs}px">${t}</text>`;
  });
  s += `<circle cx="${left + 4}" cy="10" r="4.2" fill="var(--fg)"/><text x="${left + 13}" y="14" class="t-strong" style="font-size:${fs}px">staff</text>`;
  s += `<path d="M${left + 70} 5 l5 5 l-5 5 l-5 -5z" fill="var(--accent)"/><text x="${left + 80}" y="14" style="fill:var(--accent);font-size:${fs}px">management</text>`;
  data.forEach((a, i) => {
    const y = top + i * rowH + rowH / 2;
    const st = a.survey; // staff survey score
    const hot = a.blind_spot;
    const col = hot ? "var(--crit)" : "var(--line-2)";
    s += `<text x="${left - 10}" y="${y + 4}" text-anchor="end" style="font-size:${fs}px" ${hot ? 'class="t-strong"' : ""}>${esc(nm(a.name))}</text>`;
    s += `<line x1="${x(st)}" x2="${x(a.mgmt_survey)}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="${hot ? 3 : 2}"/>`;
    s += `<circle cx="${x(st)}" cy="${y}" r="4.2" fill="var(--fg)"/>`;
    s += `<path d="M${x(a.mgmt_survey)} ${y - 5} l5 5 l-5 5 l-5 -5z" fill="var(--accent)"/>`;
    if (hot) s += `<text x="${x(a.mgmt_survey) + 10}" y="${y + 4}" style="fill:var(--crit);font-size:${fs}px">${sign(a.gap)}</text>`;
  });
  return s + "</svg>";
}

/* Surface Risk prototype — sample report view (fictional firm, data from the Python engine). */
"use strict";

const reportState = { view: "matrix", level: R.firm.reporting_level };

function bandColor(idx) { return `var(--band-${idx})`; }

function keyMessages() {
  const I = R.indices, M = R.mgmt;

    `Overall <strong>${esc(I.archetype)}</strong> (Loss ${f0(I.loss)}, Performance ${f0(I.perf)}), about ${f0(peerGap)} points behind illustrative peers. The equal-weight check ${I.robust ? "agrees, so the result is robust" : "changes the result, so treat it as sensitive"}. Top priorities: ${top.join(", ")}.`,

    `${esc(worst.entity)} is <strong>${esc(worst.archetype)}</strong> (${f0(worst.loss)} / ${f0(worst.perf)}), notably below the firm in ${worst.flags} of 20 areas after adjusting for small numbers. Leadership capability is ${f0(M.capability)}/100: ${recentTest === 0 ? "no manager has taken part in a continuity test in the last 12 months" : recentTest + " manager(s) tested the continuity plan in the last 12 months"}, and managers’ top-5 risks overlap with the assessment’s by ${f1(M.mc1_overlap_mean)} of 5 on average.`,
  ];

function matrixChart() {

  const x = (v) => pad.l + ((clamp(v, lo, hi) - lo) / (hi - lo)) * (W - pad.l - pad.r);
  const y = (v) => H - pad.b - ((clamp(v, lo, hi) - lo) / (hi - lo)) * (H - pad.t - pad.b);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Loss Index against Performance Index">`;
  const zs = [[lo, P.archetype_low], [P.archetype_low, P.archetype_high], [P.archetype_high, hi]];
  const zn = ["Low", "Mid", "High"];
  zs.forEach(([l0, l1], i) => zs.forEach(([p0, p1], j) => {
    const a = U.archetypes.find((q) => q.key === zn[i] + "|" + zn[j]);
        if ((i + j) % 2 === 0) s += `<rect class="zone" x="${x(p0)}" y="${y(l1)}" width="${x(p1) - x(p0)}" height="${y(l0) - y(l1)}"/>`;
    s += `<text class="zone-label" x="${x(p0) + 6}" y="${y(l1) + 14}">${esc(a.name)}</text>`;
  }));
  [20, 30, 40, 50, 60, 70, 80].forEach((t) => {
    s += `<line class="${t === 40 || t === 60 ? "grid-2" : "grid"}" x1="${x(t)}" x2="${x(t)}" y1="${pad.t}" y2="${H - pad.b}"/><line class="${t === 40 || t === 60 ? "grid-2" : "grid"}" x1="${pad.l}" x2="${W - pad.r}" y1="${y(t)}" y2="${y(t)}"/>`;
    s += `<text x="${x(t)}" y="${H - pad.b + 16}" text-anchor="middle">${t}</text><text x="${pad.l - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
  });
  s += `<text x="${(W + pad.l) / 2}" y="${H - 10}" text-anchor="middle" class="t-strong">Performance Index →</text>`;
  s += `<text transform="translate(16 ${(H - pad.b + pad.t) / 2}) rotate(-90)" text-anchor="middle" class="t-strong">Loss Index →</text>`;
  const placed = [];
  const order = [...pts].sort((a, b) => ({ firm: 0, mgmt: 1, peer: 2, dept: 3 }[a.kind] - { firm: 0, mgmt: 1, peer: 2, dept: 3 }[b.kind]));

    marks += g.kind === "mgmt" ? `<path d="M${cx} ${cy - 7} l7 7 l-7 7 l-7 -7z" fill="${style[0]}"/>` : g.kind === "peer" ? `<rect x="${cx - 5}" y="${cy - 5}" width="10" height="10" fill="none" stroke="${style[0]}" stroke-width="1.5"/>` : `<circle cx="${cx}" cy="${cy}" r="${style[1]}" fill="${style[0]}"/>`;
    const lbl = g.kind === "firm" ? "Firm (staff)" : g.kind === "mgmt" ? "Management" : g.kind === "peer" ? "Peers" : g.entity;
    const w = lbl.length * 6.8 + 4;
    let lx = cx + 11, ly = cy + 4;
    if (lx + w > W - pad.r) lx = cx - 11 - w;
    let guard = 0;
    while (placed.some((p) => Math.abs(p.y - ly) < 12 && lx < p.x + p.w && lx + w > p.x) && guard++ < 12) ly += 12;
    placed.push({ x: lx, y: ly, w });
    if (Math.abs(ly - (cy + 4)) > 2) labels += `<line x1="${cx}" y1="${cy}" x2="${lx - 2}" y2="${ly - 4}" stroke="var(--line-2)"/>`;
    labels += `<text x="${lx}" y="${ly}" ${g.kind === "firm" || g.kind === "mgmt" ? 'class="t-strong"' : ""}>${esc(lbl)}</text>`;
  });
  s += marks + labels;
  return s + "</svg>";
}

function tiltChart() {
  const rows = R.groups.filter((g) => g.kind !== "bl");

  [-10, -5, 0, 5, 10].forEach((t) => { s += `<line class="${t === 0 ? "grid-2" : "grid"}" x1="${xt(t)}" x2="${xt(t)}" y1="${top - 4}" y2="${H - 24}"/><text x="${xt(t)}" y="${H - 8}" text-anchor="middle">${t > 0 ? "+" : ""}${t}</text>`; });
  rows.forEach((g, i) => {

    s += `<line x1="${xl(0)}" x2="${xl(lvl)}" y1="${y}" y2="${y}" stroke="var(--line-2)" stroke-width="2"/><circle cx="${xl(lvl)}" cy="${y}" r="5" fill="${g.kind === "mgmt" ? "var(--accent)" : "var(--fg)"}"/><text x="${xl(lvl) + 10}" y="${y + 4}">${f0(lvl)}</text>`;
    const x0 = xt(0), x1 = xt(tilt);
    s += `<rect x="${Math.min(x0, x1)}" y="${y - 6}" width="${Math.max(2, Math.abs(x1 - x0))}" height="12" fill="${tilt >= 0 ? "var(--accent)" : "var(--warn)"}"/><text x="${t0 + tw + 12}" y="${y + 4}">${sign(tilt)}</text>`;
  });
  return s + "</svg>";
}

/* Surface Risk prototype — administrator set-up wizard and staff / management survey.
   Everything is held in memory; nothing leaves the browser. */
"use strict";

const PROFILE = D.profile;
const COUNTRIES = Object.keys(U.country_risk.countries);
const IDX = U.country_risk.index_types;
const TIER_PTS = P.tier_points; // {H:3, M:2, L:1}
const HIER = U.department_hierarchy;

/* ---------------- Set-up wizard ---------------- */
const setup = {
  step: 0,
  name: PROFILE.name, centre: "DIFC (DFSA)", headcount: PROFILE.headcount, levelOverride: "",
  bl: { ...PROFILE.business_line_mix },
  office: Object.keys(PROFILE.footprint.OFF)[0],
  parent: Object.keys(PROFILE.footprint.AFF)[0],
  clients: Object.entries(PROFILE.footprint.CLI).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([c, s]) => ({ c, s: Math.round(s * 100) })),
  providers: PROFILE.providers.map((p) => ({ ...p })),
  providerShares: { ...PROFILE.footprint.PRV },
  counterparties: { ...PROFILE.footprint.CPT },
  domain: PROFILE.domains, firstContact: PROFILE.first_contact, lei: "lapsed",
  checks: Object.fromEntries(U.checks.map((c) => [c.id, c.id !== "C09"])),
  rosterLoaded: true,
};
const STEPS = ["Firm", "Business lines", "Footprint", "Checks", "Staff list", "Launch"];

function defaultLevel(n) {
  for (const r of U.default_reporting_level) if (r.max_headcount_exclusive == null || n < r.max_headcount_exclusive) return r.level;
  return "C";
}
function level() { return setup.levelOverride || defaultLevel(setup.headcount); }

function firmWeights() {
  const mix = Object.entries(setup.bl).filter(([, s]) => s > 0);
  const tot = mix.reduce((t, [, s]) => t + s, 0) || 1;
  const rows = U.areas.map((a) => {
    let lp = 0, pp = 0;
    if (!mix.length) { lp = TIER_PTS[a.loss_tier]; pp = TIER_PTS[a.perf_tier]; }
    mix.forEach(([bl, s]) => {
      lp += (s / tot) * TIER_PTS[a.loss_overrides[bl] || a.loss_tier];
      pp += (s / tot) * TIER_PTS[a.perf_overrides[bl] || a.perf_tier];
    });
    return { code: a.code, name: a.name, lp, pp, baseL: TIER_PTS[a.loss_tier], baseP: TIER_PTS[a.perf_tier] };
  });
  const sl = rows.reduce((t, r) => t + r.lp, 0), sp = rows.reduce((t, r) => t + r.pp, 0);
  rows.forEach((r) => { r.lw = r.lp / sl; r.pw = r.pp / sp; });
  return rows;
}

function footprintShares() {
  const cli = {}; let used = 0;
  setup.clients.forEach(({ c, s }) => { if (c && s > 0) { cli[c] = (cli[c] || 0) + s / 100; used += s / 100; } });
  if (used < 1) cli["Rest of world (average)"] = (cli["Rest of world (average)"] || 0) + (1 - used);
  const norm = (o) => { const t = Object.values(o).reduce((a, b) => a + b, 0) || 1; return Object.fromEntries(Object.entries(o).map(([k, v]) => [k, v / t])); };
  return { OFF: { [setup.office]: 1 }, AFF: { [setup.parent]: 1 }, CLI: norm(cli), PRV: norm(setup.providerShares), CPT: norm(setup.counterparties) };
}
function exposures() {
  const fp = footprintShares();
  const risk = (country, idx) => (U.country_risk.countries[country] || U.country_risk.countries["Rest of world (average)"])[idx];
  return U.exposures.map((e) => {
    let v = 0;
    Object.entries(e.footprint_weights).forEach(([f, w]) => {
      if (!w) return;
      Object.entries(fp[f] || {}).forEach(([c, s]) => { v += w * s * risk(c, e.index); });
    });
    return { ...e, value: v };
  });
}
function areaPenalties() {
  const ex = exposures(), by = {};
  ex.forEach((e) => { (by[e.area] = by[e.area] || []).push(e.value); });
  return Object.entries(by).map(([area, vals]) => {
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    return { area, exposure: avg, penalty: P.penalty_per_point * Math.max(0, avg - P.exposure_baseline) };
  });
}

function rosterGroups(lv) {
  // Start from level C counts, aggregate to the chosen level, then merge any group below the minimum
  // into its smallest sibling under the same parent (the engine applies the same rule to actual responses).
  const key = { A: "level_a", B: "level_b", C: "level_c" }[lv];
  const parentKey = { A: null, B: "level_a", C: "level_b" }[lv];
  const groups = {};
  HIER.forEach((h) => {
    const n = D.roster[h.level_c] || 0;
    const g = (groups[h[key]] = groups[h[key]] || { name: h[key], n: 0, parent: parentKey ? h[parentKey] : "Firm" });
    g.n += n;
  });
  let list = Object.values(groups).filter((g) => g.n > 0);
  const min = P.min_reporting_group;
  let changed = true;
  while (changed) {
    changed = false;
    list.sort((a, b) => a.n - b.n);
    const small = list.find((g) => g.n < min);
    if (!small) break;
    const sib = list.filter((g) => g !== small && g.parent === small.parent).sort((a, b) => a.n - b.n)[0];
    if (sib) { sib.name = sib.name + " + " + small.name; sib.n += small.n; list = list.filter((g) => g !== small); changed = true; }
  }
  return list.sort((a, b) => b.n - a.n);
}

/* ---------------- Survey ---------------- */
const ANCHORS = {
  "How true (5 anchors)": ["Not true", "Rarely true", "Partly true", "Mostly true", "Fully true"],
  "How often (5 anchors)": ["Never", "Rarely", "Sometimes", "Often", "Very often"],
};
const SCENARIO_Q44 = [
  ["Process it as asked", 0], ["Reply to the email to confirm", 25], ["Ask a colleague whether it looks genuine", 50],
  ["Call the client on the number already on file, or pass it to payments flagged as suspicious", 100],
];
const survey = { role: "staff", page: 0, answers: {}, profile: {}, activity: { a3: [], a4: [] }, mc: { mc1: [] }, ma: {} };

function surveyPages() {
  const pages = [{ kind: "intro" }, { kind: "profile" }];
  const codes = U.areas.map((a) => a.code);
  for (let i = 0; i < codes.length; i += 3) pages.push({ kind: "statements", areas: codes.slice(i, i + 3) });
  pages.push({ kind: "activity" }, { kind: "open" });
  if (survey.role === "mgmt") pages.push({ kind: "capability" }, { kind: "alignment" });
  pages.push({ kind: "done" });
  return pages;
}

function answerValue(st, raw) {
  if (raw == null || raw === "dk") return null;
  const v = typeof raw === "number" ? raw : raw === "Yes" ? 100 : 0;
  return st.reverse ? 100 - v : v;
}

function statementHTML(st) {
  const cur = survey.answers[st.id];
  let ctrl;
  if (st.format.startsWith("How")) {
    const labels = ANCHORS[st.format];
    ctrl = `<div class="anchors" role="group" aria-label="Answer">${labels.map((l, i) => `<button type="button" data-ans="${st.id}" data-v="${i * 25}" aria-pressed="${cur === i * 25}">${l}</button>`).join("")}<button type="button" class="dk" data-ans="${st.id}" data-v="dk" aria-pressed="${cur === "dk"}">Don’t know</button></div>`;
  } else if (st.format === "Yes / No") {
    ctrl = `<div class="opts inline" role="group" aria-label="Answer">${["Yes", "No"].map((l) => `<button type="button" data-ans="${st.id}" data-v="${l}" aria-pressed="${cur === l}">${l}</button>`).join("")}<button type="button" data-ans="${st.id}" data-v="dk" aria-pressed="${cur === "dk"}">Don’t know</button></div>`;
  } else {
    ctrl = `<div class="opts" role="group" aria-label="Answer">${SCENARIO_Q44.map(([l, v]) => `<button type="button" data-ans="${st.id}" data-v="${v}" aria-pressed="${cur === v}">${esc(l)}</button>`).join("")}</div>`;
  }
  const text = st.text.replace(/^Scenario: /, "");
  return `<div class="q"><span class="qid">${st.id}</span><div class="qtext">${esc(text)}</div>${ctrl}</div>`;
}

}

      <div class="stack">${U.alignment.map((q) => `<div class="field"><label for="ma-${q.id}">${q.id} · ${esc(q.text)}</label><input type="range" id="ma-${q.id}" data-ma="${q.id}" min="0" max="100" step="5" value="${survey.ma[q.id] ?? 50}"><div class="row small faint" style="justify-content:space-between"><span>Disagree</span><span class="mono" id="mav-${q.id}">${survey.ma[q.id] ?? 50}</span><span>Agree</span></div></div>`).join("")}</div>`;

function personalAreaScores() {
  return U.areas.map((a) => {
    const vals = U.statements.filter((s) => s.area === a.code).map((s) => answerValue(s, survey.answers[s.id])).filter((v) => v != null);
    return { ...a, n: vals.length, score: vals.length ? vals.reduce((x, y) => x + y, 0) / vals.length : null };
  });
}
function capabilityScore() {
  const ms = U.mgmt_capability, sc = [];
  const pts = (id, ans) => { const t = D.mgmtScoring[id]; const r = t && t.find((x) => x.answer === ans); return r ? r.points : null; };
  ["MC2", "MC3", "MC5", "MC6", "MC7"].forEach((id) => { const p = pts(id, survey.mc[id]); if (p != null) sc.push(p); });
  const owned = PROFILE.providers.filter((p, i) => survey.mc["mc4_" + i]).length;
  if (owned) sc.push((PROFILE.providers.filter((p, i) => survey.mc["mc4_" + i] === p.owner).length / PROFILE.providers.length) * 100);
  if (survey.mc.MC8a) sc.push((survey.mc.MC8a === PROFILE.first_contact ? 50 : 0) + (survey.mc.MC8b === "Yes" ? 50 : 0));
  return sc.length ? sc.reduce((a, b) => a + b, 0) / sc.length : null;
}

function doneHTML() {
  const sc = personalAreaScores().filter((a) => a.score != null);
  const answered = U.statements.filter((s) => survey.answers[s.id] != null).length;
  const top = new Set(R.priorities.top.map((p) => areaMeta[p.code].name));
  const overlap = survey.mc.mc1.filter((n) => top.has(n)).length;
  const cap = capabilityScore();
  return `<div class="stack-lg"><div class="stack" style="gap:10px"><span class="eyebrow">Thank you</span><h1 style="font-size:var(--step-3)">Your answers are in</h1>
    <p class="muted">You answered ${answered} of 60 statements. In the live product your answers join your colleagues’ and appear only in group results.</p></div>
    ${sc.length ? `<div class="panel stack"><div class="row" style="justify-content:space-between"><span class="eyebrow">Demo only: how your answers score</span><span class="small faint">respondents do not see this in the live product</span></div>
      <div class="stack" style="gap:6px">${sc.map((a) => `<div class="stack" style="gap:3px"><div class="row small" style="justify-content:space-between"><span class="muted">${esc(a.name)}</span><span class="mono">${f0(a.score)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${a.score}%;background:var(--band-${bandOf(a.score).idx})"></div></div></div>`).join("")}</div></div>` : ""}
    ${survey.role === "mgmt" ? `<div class="panel stack"><span class="eyebrow">Demo only: your management answers</span><dl class="kv"><dt>Your top-5 risks matching the sample firm’s top 5 priorities</dt><dd>${overlap} / 5</dd><dt>Capability score from your factual answers</dt><dd>${cap == null ? "–" : f0(cap)}</dd></dl></div>` : ""}
    <div class="row"><a class="btn primary" href="#report">See the sample report</a><button class="btn" type="button" id="restart">Start again</button></div></div>`;
}

function fillSample() {
  // Plausible answers around the fictional firm's staff scores for each area.
  let seed = 7;
  const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  U.statements.forEach((s) => {
    const base = R.areas.find((a) => a.code === s.area).survey;
    let v = clamp(base + (rnd() - 0.5) * 50, 0, 100);
    if (s.reverse) v = 100 - v;
    if (s.format === "Yes / No") survey.answers[s.id] = v >= 50 ? "Yes" : "No";
    else if (s.format.startsWith("How")) survey.answers[s.id] = Math.round(v / 25) * 25;
    else survey.answers[s.id] = [0, 25, 50, 100][Math.min(3, Math.floor(v / 26))];
  });
  survey.profile = { Z1: HIER[2].level_c, Z2: "Asset Management", Z3: "Individual contributor", Z4: "1–3 years" };
  survey.activity = { a1: U.processes[5].name, A2: "10–20%", a3: [U.processes[6].name], a4: [U.processes[3].name] };
  if (survey.role === "mgmt") {
    survey.mc = { mc1: ["Cyber security & access", "External fraud", "Process execution", "Governance & oversight", "Culture & speak-up"], MC2: "Documented but rarely used", MC3: "1", MC5: "12-24 months", MC6: "3-12 months", MC7: "Quarterly", MC8a: "IT provider incident line", MC8b: "No" };
    PROFILE.providers.forEach((p, i) => { survey.mc["mc4_" + i] = i % 2 ? "COO" : p.owner; });
    U.alignment.forEach((q, i) => { survey.ma[q.id] = [70, 40, 60, 55, 35, 80, 30, 50][i] ?? 50; });
  }
}

      if (t.dataset.pick) {
        const k = t.dataset.pick, v = t.dataset.v;
        if (k.startsWith("Z")) survey.profile[k] = v; else if (k === "A2") survey.activity.A2 = v; else survey.mc[k] = v;
        $$(`[data-pick="${k}"]`, box).forEach((b) => b.setAttribute("aria-pressed", String(b === t)));
        return;
      }
      if (t.dataset.multi) {
        const k = t.dataset.multi, v = t.dataset.v;
        const arr = k === "mc1" ? survey.mc.mc1 : survey.activity[k];
        const i = arr.indexOf(v);
        if (i >= 0) arr.splice(i, 1); else if (k !== "mc1" || arr.length < 5) arr.push(v); else { toast("Pick five areas at most"); return; }
        t.setAttribute("aria-pressed", String(arr.includes(v)));
        if (k === "mc1") { const l = t.closest(".stack").querySelector(".label"); if (l) l.textContent = `MC1 · Select the five areas you believe pose the greatest risk to the firm today (${arr.length}/5)`; }
      }
    });
    box.addEventListener("input", (e) => {
      const t = e.target;
      if (t.dataset.ma) { survey.ma[t.dataset.ma] = +t.value; $("#mav-" + t.dataset.ma).textContent = t.value; }
      if (t.id === "o1") survey.o1 = t.value;
      if (t.id === "o2") survey.o2 = t.value;
    });
    box.addEventListener("change", (e) => {
      const t = e.target;
      if (t.id === "a1") survey.activity.a1 = t.value;
      if (t.dataset.mc4) survey.mc["mc4_" + t.dataset.mc4] = t.value;
    });
  },
});

/* ---------------- Boot ---------------- */
renderShell();
window.addEventListener("hashchange", () => { closeDrawer(); go(); });
go();

</script>
</body>
</html>
